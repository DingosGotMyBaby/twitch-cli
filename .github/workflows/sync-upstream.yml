name: Sync Upstream

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync with twitchdev/twitch-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        id: merge
        run: |
          git remote add upstream https://github.com/twitchdev/twitch-cli.git
          git fetch upstream main

          # Check if there are differences between local main and upstream main
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/main)

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up-to-date with upstream/main."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Merging upstream changes into main..."
          git merge upstream/main --no-edit -m "chore(sync): merge upstream changes from twitchdev/twitch-cli"
          git push origin main
          echo "has_changes=true" >> $GITHUB_OUTPUT
